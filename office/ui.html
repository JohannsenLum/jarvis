<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis Office</title>
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16202A; --ink-2:#56636F; --line:#D5DCE2;
  --accent:#C8871E; --accent-soft:#F6E9D2; --work:#1F8A5B; --work-soft:#DDF2E7; --warn:#B4441F; --warn-soft:#F8E1D8;
  --floor-a:#E4DCCB; --floor-b:#DDD3BF; --wall:#CFC4AE; --desk:#8C6A45; --desk-top:#A88158;
  --mono:ui-monospace,"SF Mono",Menlo,monospace; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161C; --surface:#18212A; --ink:#E6ECF0; --ink-2:#98A6B2; --line:#2A3743;
    --accent:#E0A547; --accent-soft:#3A2D16; --work:#4CC38A; --work-soft:#143324; --warn:#F07A52; --warn-soft:#3C1E14;
    --floor-a:#2A2620; --floor-b:#25221C; --wall:#3A342A; --desk:#5E4630; --desk-top:#77593C;
  }
}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#18212A; --ink:#E6ECF0; --ink-2:#98A6B2; --line:#2A3743;
  --accent:#E0A547; --accent-soft:#3A2D16; --work:#4CC38A; --work-soft:#143324; --warn:#F07A52; --warn-soft:#3C1E14;
  --floor-a:#2A2620; --floor-b:#25221C; --wall:#3A342A; --desk:#5E4630; --desk-top:#77593C;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
header h1{font-size:17px;margin:0;letter-spacing:.02em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink-2);display:inline-block}
.dot.on{background:var(--work);box-shadow:0 0 0 3px var(--work-soft)}
.sub{color:var(--ink-2);font-size:13px}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
main{flex:1;display:grid;grid-template-columns:1fr minmax(320px,420px);min-height:0}
@media (max-width:900px){main{grid-template-columns:1fr}.panel{border-left:0;border-top:1px solid var(--line);min-height:60vh}}
.stage{overflow:auto;padding:18px}
/* permissions */
.perms{display:grid;gap:10px;margin-bottom:16px}
.perm{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.perm b{font-family:var(--mono);font-size:13px}
.perm code{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);word-break:break-all}
.perm .grow{flex:1;min-width:200px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 14px;font:inherit;font-size:13.5px;cursor:pointer}
.btn.primary{background:var(--work);border-color:var(--work);color:#fff}
.btn.danger{border-color:var(--warn);color:var(--warn)}
/* office view */
.room{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:
    linear-gradient(var(--wall),var(--wall)) top/100% 70px no-repeat,
    repeating-conic-gradient(var(--floor-a) 0 25%,var(--floor-b) 0 50%) 0 0/48px 48px;
  min-height:520px;padding:90px 24px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:34px 24px;align-content:start;image-rendering:pixelated}
.room::before{content:"JARVIS · HQ";position:absolute;top:22px;left:24px;font:700 13px/1 var(--mono);letter-spacing:.2em;color:var(--ink-2)}
.room .window{position:absolute;top:14px;right:24px;width:120px;height:40px;border:4px solid var(--desk);background:linear-gradient(#9CC6E8,#D7ECFA)}
.station{position:relative;display:grid;justify-items:center;gap:6px;cursor:pointer;padding:8px;border-radius:12px;border:2px solid transparent;background:none;color:inherit;font:inherit}
.station:focus-visible,.station.sel{border-color:var(--accent);outline:none;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.station.boss{grid-column:2}
.char{font-size:40px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18));transition:transform .3s}
.station.working .char{animation:bob .9s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.deskbox{width:120px;height:38px;background:var(--desk);border-top:10px solid var(--desk-top);border-radius:4px;position:relative}
.deskbox::after{content:"";position:absolute;left:44px;top:-26px;width:32px;height:20px;background:#27313B;border:3px solid #3E4A55;border-radius:2px}
.station.working .deskbox::after{background:#3FA37A}
.name{font:600 12.5px/1.2 var(--mono);letter-spacing:.04em}
.bubble{max-width:190px;min-height:22px;font-size:12px;color:var(--ink-2);text-align:center;line-height:1.3}
.station.working .bubble{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.visitors{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:2px dashed color-mix(in srgb,var(--ink-2) 40%,transparent);padding-top:14px}
.visitors .label{font:600 12px var(--mono);color:var(--ink-2);letter-spacing:.08em}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:inherit}
.chip.working{border-color:var(--work);color:var(--work)}
.po-wrap{position:relative;margin:0 auto;width:max-content;max-width:100%}
.po-wrap canvas{display:block;border-radius:16px;background:radial-gradient(ellipse at 50% 45%,#2B3A4D,#121A24 72%)}
.po-overlay{position:absolute;inset:0;pointer-events:none}
.po-hit{position:absolute;pointer-events:auto;background:none;border:0;cursor:pointer;padding:0;border-radius:6px}
.po-hit:focus-visible{outline:2px dashed rgba(255,255,255,.6);outline-offset:2px}
.po-bubble{position:absolute;transform:translate(-50%,-100%);font:600 11px/1.2 var(--mono);background:#FFFDF6;color:#1B1B1F;border:2px solid #1B1B1F;border-radius:8px;padding:3px 7px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 #1B1B1F;pointer-events:none}
.po-bubble.m-working{background:#E6FBEF}
.po-bubble.m-asking{background:#FFD9C7;animation:po-pulse 1s steps(2) infinite}
.po-bubble.m-waiting{background:#FFF4D8}
@keyframes po-pulse{50%{margin-top:-3px}}
.po-name{position:absolute;left:50%;bottom:0;transform:translate(-50%,calc(100% + 4px));font:700 11px/1 var(--mono);color:#fff;background:rgba(20,24,32,.88);padding:4px 7px;border-radius:5px;letter-spacing:.03em;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.po-hit:hover .po-name,.po-hit:focus-visible .po-name,.po-hit.sel .po-name{opacity:1}
.po-hit.sel .po-name{background:var(--accent);color:#1B1B1F}
.po-board .po-name{bottom:auto;top:0;transform:translate(-50%,-110%)}
.layout-toggle a{color:var(--ink-2)} .layout-toggle a.on{color:var(--accent);font-weight:700;text-decoration:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
/* ops HUD (always dark, like a command centre) */
.stage.ops{background:radial-gradient(ellipse at 50% 0%,#0E2A44 0%,#071322 55%,#050B14 100%);padding:14px}
.hud{--c:#4FD1FF;--c2:#7CF7D4;--hud-ink:#D8F1FF;--hud-dim:#6F93AD;--hud-line:rgba(79,209,255,.22);--hud-warn:#FFB454;color:var(--hud-ink);font-family:var(--sans)}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.hud-status{font:600 11px var(--mono);letter-spacing:.18em;border:1px solid var(--hud-line);border-radius:999px;padding:6px 12px;display:flex;gap:8px;align-items:center;background:rgba(8,30,50,.6)}
.hud-status i{width:7px;height:7px;border-radius:50%;background:var(--c2);box-shadow:0 0 8px var(--c2)}
.hud-status b{color:var(--c2)} .hud-status.warn i{background:var(--hud-warn);box-shadow:0 0 8px var(--hud-warn)} .hud-status.warn b{color:var(--hud-warn)}
.hud-clock{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.hud-clock em{font-style:normal;font-size:12px;color:var(--hud-dim)}
.hud-clock b{font:700 26px var(--mono);color:var(--c);text-shadow:0 0 12px rgba(79,209,255,.6);letter-spacing:.04em}
.hud-plan{display:flex;gap:10px;font:600 11px var(--mono);letter-spacing:.12em}
.hud-plan span{border:1px solid var(--hud-line);border-radius:8px;padding:6px 10px;background:rgba(8,30,50,.6)} .hud-plan b{color:var(--c)} .hud-plan .dim{color:var(--hud-dim);letter-spacing:0;font-weight:400}
.hud-grid{display:grid;grid-template-columns:minmax(220px,1fr) minmax(300px,1.5fr) minmax(240px,1fr);gap:12px}
@media (max-width:1250px){.hud-grid{grid-template-columns:1fr 1fr}.hud-orb{grid-column:1/-1;order:-1}}
@media (max-width:700px){.hud-grid{grid-template-columns:1fr}}
.hud-panel{position:relative;background:linear-gradient(180deg,rgba(12,38,62,.72),rgba(6,20,36,.72));border:1px solid var(--hud-line);border-radius:12px;padding:12px 14px;box-shadow:inset 0 0 24px rgba(79,209,255,.05)}
.hud-panel::before,.hud-panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--c);opacity:.7}
.hud-panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.hud-panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.hud-panel h3{margin:0 0 10px;font:700 11.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--c);display:flex;align-items:center;gap:8px}
.hud-panel h3 .live{font-size:9.5px;letter-spacing:.1em;color:var(--c2);border:1px solid var(--c2);border-radius:999px;padding:1px 6px;margin-left:auto}
.hud-panel.wide{grid-column:span 1}
.hud-orb{position:relative;display:grid;place-items:center;min-height:300px;border:1px solid var(--hud-line);border-radius:12px;background:radial-gradient(ellipse at 50% 50%,rgba(20,70,110,.45),rgba(4,14,26,.2) 70%)}
.hud-orb canvas{width:100%;max-width:560px;height:auto}
.hud-orb-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.hud-orb-text b{font:800 38px var(--mono);letter-spacing:.35em;color:#E8FAFF;text-shadow:0 0 18px rgba(79,209,255,.9);margin-left:.35em}
.hud-orb-text span{font:600 11px var(--mono);letter-spacing:.3em;color:var(--c)}
.hud-list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.hud-list li{display:grid;grid-template-columns:28px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;border:1px solid var(--hud-line);border-radius:9px;padding:6px 10px;background:rgba(10,34,56,.55)}
.hud-list i{grid-row:span 2;font-style:normal;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(79,209,255,.12);color:var(--c)}
.hud-list span{font-weight:600;font-size:13px} .hud-list b{font-weight:500;font-size:12px;color:var(--hud-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-list li.on b{color:var(--c2)} .hud-list li.ok b{color:#8FD7FF} .hud-list li.warn b{color:var(--hud-warn)}
.hud-feed{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hud-feed li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;font-size:12.5px;border-left:2px solid var(--hud-line);padding:3px 8px;background:rgba(10,34,56,.4);border-radius:0 6px 6px 0}
.hud-feed b{color:var(--c);font-weight:600;font-size:12px} .hud-feed span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--hud-ink)} .hud-feed em{font-style:normal;color:var(--hud-dim);font:11px var(--mono)}
.hud-feed .k-agent{border-left-color:var(--c2)} .hud-feed .k-warn{border-left-color:var(--hud-warn)} .hud-feed .k-you{border-left-color:#C9A0FF} .hud-feed .k-vault{border-left-color:#8FD7FF}
.hud-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.hud-kpis div{border:1px solid var(--hud-line);border-radius:9px;padding:8px 10px;background:rgba(10,34,56,.55);display:grid}
.hud-kpis em{font-style:normal;font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--hud-dim)}
.hud-kpis b{font:700 22px var(--mono);color:#E8FAFF;text-shadow:0 0 10px rgba(79,209,255,.45)} .hud-kpis span{font-size:11px;color:var(--hud-dim)}
.hud-bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;height:74px;align-items:end;margin:12px 0 6px}
.hud-bars div{display:grid;grid-template-rows:1fr auto;height:100%;align-items:end;text-align:center}
.hud-bars i{display:block;background:linear-gradient(180deg,var(--c),rgba(79,209,255,.25));border-radius:3px 3px 0 0;box-shadow:0 0 8px rgba(79,209,255,.35)}
.hud-bars span{font:10px var(--mono);color:var(--hud-dim);margin-top:3px}
.hud-table{width:100%;min-width:0;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.hud-table th{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--hud-dim);text-align:left;padding:4px 6px;border-bottom:1px solid var(--hud-line);background:none}
.hud-table td{padding:5px 6px;border-bottom:1px solid rgba(79,209,255,.08);white-space:nowrap;font-weight:400}
.hud-table td:last-child,.hud-table th:last-child{text-align:right;color:var(--c)}
.hud-note{font-size:11.5px;color:var(--hud-dim);margin:8px 0 0;max-width:none} .hud-note.warn{color:var(--hud-warn)}
.hud-agents{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hud-agent{display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto auto;column-gap:8px;text-align:left;border:1px solid var(--hud-line);border-radius:9px;padding:8px;background:rgba(10,34,56,.55);color:var(--hud-ink);font:inherit;cursor:pointer}
.hud-agent i{grid-row:span 3;font-style:normal;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(79,209,255,.12);color:var(--c)}
.hud-agent b{font-size:13px} .hud-agent span{font-size:11.5px;color:var(--hud-dim)} .hud-agent em{font-style:normal;font-size:11px;color:var(--hud-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-agent.on{border-color:var(--c2);box-shadow:0 0 12px rgba(124,247,212,.25)} .hud-agent.on span{color:var(--c2)} .hud-agent.warn span{color:var(--hud-warn)}
.hud-agent:hover,.hud-agent:focus-visible{border-color:var(--c);outline:none}
.hud-cmds{display:grid;gap:6px}
.hud-cmds button{text-align:left;border:1px solid var(--hud-line);border-radius:8px;padding:8px 10px;background:rgba(10,34,56,.55);color:var(--hud-ink);font:inherit;font-size:13px;cursor:pointer}
.hud-cmds button:hover,.hud-cmds button:focus-visible{border-color:var(--c);color:#fff;outline:none;box-shadow:0 0 10px rgba(79,209,255,.25)}
.hud-rows{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.hud-rows li{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:4px 2px;border-bottom:1px solid rgba(79,209,255,.08)}
.hud-rows i{width:7px;height:7px;border-radius:50%;background:var(--hud-dim)} .hud-rows li.on i{background:var(--c2);box-shadow:0 0 6px var(--c2)}
.hud-rows b{font-weight:500;color:var(--hud-dim);font-size:12px} .hud-rows li.on b{color:var(--c2)}
.hud-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hud-mini div{border:1px solid var(--hud-line);border-radius:9px;padding:8px;background:rgba(10,34,56,.55);display:grid;text-align:center}
.hud-mini b{font:700 20px var(--mono);color:#E8FAFF} .hud-mini span{font-size:11px;color:var(--hud-dim)} .hud-mini .warn b{color:var(--hud-warn)}
.hud-rings{display:flex;justify-content:space-around;margin-bottom:8px}
.hud-ring{position:relative;width:84px;display:grid;justify-items:center}
.hud-ring svg{width:74px;height:74px} .hud-ring .bg{fill:none;stroke:rgba(79,209,255,.12);stroke-width:6} .hud-ring .fg{fill:none;stroke:var(--c);stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(79,209,255,.6))}
.hud-ring .fg.hot{stroke:var(--hud-warn)}
.hud-ring b{position:absolute;top:25px;font:700 14px var(--mono)} .hud-ring span{font:600 10.5px var(--mono);letter-spacing:.12em;color:var(--hud-dim)} .hud-ring em{font-style:normal;font-size:10px;color:var(--hud-dim)}
.state{font:600 11px var(--mono);padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.state.working{background:var(--work-soft);color:var(--work)}
/* panel */
.panel{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.panel .head{padding:14px 16px;border-bottom:1px solid var(--line)}
.panel .head h2{margin:0;font-size:16px;display:flex;gap:8px;align-items:center}
.log{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;font-size:14px}
.msg.user{align-self:flex-end;background:var(--accent-soft)}
.msg.assistant{align-self:flex-start;background:var(--bg)}
.msg.tool{align-self:flex-start;font:12px/1.4 var(--mono);color:var(--ink-2);padding:2px 4px}
.msg code{font-family:var(--mono);font-size:.9em}
.msg pre.block{margin:6px 0;padding:8px;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:8px;font:12.5px/1.4 var(--mono);white-space:pre-wrap}
.compose{border-top:1px solid var(--line);padding:12px;display:grid;gap:8px}
.compose textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--ink)}
.compose .row{display:flex;gap:8px;align-items:center}
.hint{font-size:12px;color:var(--ink-2)}
.empty{color:var(--ink-2);font-size:13.5px;padding:10px 0}
.term{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:8px}
.term summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.term.asking{background:var(--accent-soft)}
.term.asking summary{color:var(--ink);font-weight:600}
.term pre{margin:0;max-height:260px;overflow:auto;background:#0E1319;color:#D8E1E8;border-radius:8px;padding:10px;font:12px/1.35 var(--mono);white-space:pre}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys .btn{padding:5px 10px;font-family:var(--mono);font-size:12.5px}
.actions{display:grid;gap:10px;padding:0 16px}
.actions:empty{display:none}
.actions > div{margin-top:12px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px;display:grid;gap:8px}
.actions .q{border-color:var(--accent);background:var(--accent-soft)}
.actions .brainbox{border-color:var(--line);background:var(--bg)}
.actions b{font-size:14px} .actions code{font-family:var(--mono);font-size:12px;color:var(--ink-2);word-break:break-word}
.actions .row{display:flex;gap:8px;flex-wrap:wrap}
.actions .opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.actions .opt:hover,.actions .opt:focus-visible{border-color:var(--accent);outline:none}
.graph{position:fixed;inset:0;z-index:50;background:#0B1017;display:none;flex-direction:column}
.graph.open{display:flex}
.graph header{background:#111822;border-color:#1F2A36;color:#E6ECF0}
.graph canvas{flex:1;display:block;width:100%;cursor:grab}

<body>
<header>

  <div class="seg" role="group" aria-label="View">
    <button id="v-office" aria-pressed="true">Office</button>
    <button id="v-ops" aria-pressed="false">Command</button>
  </div>
</header>
<main>
  <section class="stage">
    <div class="perms" id="perms"></div>
    <div id="view"></div>
  </section>
  <aside class="panel" id="conversation-panel" aria-label="Conversation">
    <div id="chat-resizer" role="separator" tabindex="0" aria-label="Resize conversation panel" aria-orientation="vertical" aria-controls="conversation-panel" title="Drag to resize chat · arrow keys to adjust · double-click to reset"></div>
    <div class="head"><h2 id="p-title">Jarvis</h2><div class="sub" id="p-sub"></div></div>
    <div class="actions" id="actions"></div>
    <div class="log" id="log"></div>
    <details class="term" id="term">
      <summary id="termSum">Terminal</summary>
      <pre id="screen"></pre>
      <div class="keys">
        <button class="btn" data-key="Up">↑</button><button class="btn" data-key="Down">↓</button>
        <button class="btn" data-key="Space">Space</button><button class="btn primary" data-key="Enter">Enter</button>
        <button class="btn" data-key="Tab">Tab</button><button class="btn" data-key="Escape">Esc</button>
        <button class="btn" data-key="1">1</button><button class="btn" data-key="2">2</button><button class="btn" data-key="3">3</button><button class="btn" data-key="4">4</button>
      </div>
    </details>
    <div class="compose">
      <textarea id="text" placeholder="Message Jarvis…  (Enter to send, Shift+Enter for a new line)"></textarea>
      <div class="row">
        <button class="btn primary" id="sendBtn">Send</button>
        <button class="btn" id="escBtn" title="Same as pressing Esc in the terminal">Interrupt</button>
        <span class="hint" id="hint">Typed into your terminal session, so both stay in sync.</span>
      </div>
    </div>
  </aside>
</main>

<div class="graph" id="graph" role="dialog" aria-label="Brain graph">
  <header><h1>The Brain</h1><span class="sub" id="g-sub"></span><span class="spacer"></span>
    <div class="legend2" id="g-legend"></div>
    <button class="btn" id="g-obsidian">Open in Obsidian</button><button class="btn" id="g-close">Close</button></header>
  <canvas id="g-canvas"></canvas>
  <div class="note" id="g-note"></div>
</div>

<script src="/ops-view.js"></script>
<script>
const TOKEN = "__UI_TOKEN__";
const DESK = {
  librarian: { icon: "📚", label: "Librarian", job: "files and tidies the vault" },
  researcher: { icon: "🔍", label: "Researcher", job: "web and vault research" },
  critic: { icon: "🧐", label: "Critic", job: "second opinions" },
  creative: { icon: "🎨", label: "Creative", job: "images, video, diagrams" },
};
let state = null, selected = "jarvis", view = "ops";
try { view = localStorage.getItem("office-view") === "office" ? "office" : "ops"; } catch {}

const $ = (id) => document.getElementById(id);
// Persist the requested width separately so a temporarily smaller window doesn't overwrite it.
(() => {
  const handle = $("chat-resizer"), panel = $("conversation-panel");
  let preferred = 320, pointer = null;
  try { const saved = Number(localStorage.getItem("jarvis-chat-width")); if (saved >= 260 && Number.isFinite(saved)) preferred = saved; } catch {}
  const limits = () => ({ min: 260, max: Math.max(260, Math.min(800, window.innerWidth - 640)) });
  function apply(width, save = false) {
    const { min, max } = limits();
    const value = Math.round(Math.max(min, Math.min(max, width)));
    document.documentElement.style.setProperty("--chat-width", `${value}px`);
    handle.setAttribute("aria-valuemin", min);
    handle.setAttribute("aria-valuemax", max);
    handle.setAttribute("aria-valuenow", value);
    handle.setAttribute("aria-valuetext", `Chat width ${value} pixels`);
    if (save) { preferred = value; try { localStorage.setItem("jarvis-chat-width", value); } catch {} }
  }
  handle.addEventListener("pointerdown", e => {
    if (e.button !== 0 || window.innerWidth <= 900) return;
    e.preventDefault(); pointer = e.pointerId; handle.focus(); handle.setPointerCapture(pointer);
    document.body.classList.add("resizing-chat");
  });
  handle.addEventListener("pointermove", e => {
    if (e.pointerId === pointer) apply(panel.getBoundingClientRect().right - e.clientX, true);
  });
  const finish = () => { pointer = null; document.body.classList.remove("resizing-chat"); };
  handle.addEventListener("pointerup", finish);
  handle.addEventListener("pointercancel", finish);
  handle.addEventListener("lostpointercapture", finish);
  handle.addEventListener("dblclick", () => apply(320, true));
  handle.addEventListener("keydown", e => {
    const width = panel.getBoundingClientRect().width, step = e.shiftKey ? 50 : 20;
    const values = { ArrowLeft: width + step, ArrowRight: width - step, Home: limits().min, End: limits().max };
    if (!(e.key in values)) return;
    e.preventDefault(); apply(values[e.key], true);
  });
  window.addEventListener("resize", () => { if (window.innerWidth <= 900) finish(); apply(preferred); });
  apply(preferred);
})();

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (s) => esc(s).split(/```[a-z]*\n?/).map((part, i) => i % 2
  ? `<pre class="block">${part.replace(/\n$/, "")}</pre>`
  : part.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")).join("");
// What a state means for who: the main session waits for you, sub-agents are done.
const stateLabel = (id, st) => label(id, st, state?.screen?.asking);
const label = (id, st, asking) => st === "working" ? "working" : id === "jarvis"
  ? (asking ? "needs you" : st === "offline" ? "offline" : "waiting for you") : (st ? "done" : "not called yet");
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), Math.max(2200, t.length * 55)); }

async function post(url, data) {
  const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json", "x-office-token": TOKEN }, body: JSON.stringify(data) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function target(id) {
  if (!state) return null;
  if (id === "jarvis") return { ...state.main, id, title: "Jarvis", sub: state.main.title || "main session" };
  if (id === "board") {
    const b = state.board || { todo: [], doing: [], done: [] };
    const list = (name, items) => `${name} (${items.length})\n` + (items.length ? items.map((x) => `• ${x.title}${x.kind && x.kind !== "task" && x.kind !== "loop" ? `  (${x.kind})` : ""}`).join("\n") : "—");
    return { id, title: "Task board", sub: "Claude Code's task list, agent runs, and open loops from now.md", state: "", brain: true,
      messages: [{ role: "assistant", text: list("TO DO", b.todo) }, { role: "assistant", text: list("DOING", b.doing) }, { role: "assistant", text: list("DONE (last 12 h)", b.done) }] };
  }
  if (id === "brain") return { id, title: "The Brain", sub: "your vault · now.md is Jarvis's short-term memory", state: "", brain: true,
    messages: state.now ? [{ role: "assistant", text: state.now }] : [] };
  const d = state.desks.find((x) => x.type === id);
  if (d) return d.latest ? { ...d.latest, id, title: DESK[id].label, sub: d.latest.description || DESK[id].job }
                         : { id, title: DESK[id].label, sub: DESK[id].job, state: "idle", messages: [] };
  const v = state.visitors.find((x) => x.id === id);
  return v ? { ...v, id, title: v.type, sub: v.description } : null;
}

let mounted = false;
function renderOffice() {
  if (!mounted || !$("view").querySelector(".po-wrap")) {
    PixelOffice.mount($("view"), (id) => { selected = id; render(); });
    $("view").insertAdjacentHTML("beforeend", '<div class="legend"><span>💬 waiting for you</span><span>⌨️ working</span><span>❗ needs you</span><span>✓ done</span><span>Hover anyone for their name · click to open their conversation · click the board for tasks</span><span class="layout-toggle">Office: <a href="#" data-desks="10">10 desks</a> · <a href="#" data-desks="20">20 desks</a></span></div>');
    $("view").querySelectorAll("[data-desks]").forEach((a) => { if ((localStorage.getItem("office-desks") || "10") === a.dataset.desks) a.classList.add("on");
      a.onclick = (e) => { e.preventDefault(); try { localStorage.setItem("office-desks", a.dataset.desks); } catch {} location.reload(); }; });
    mounted = true;
  }
  PixelOffice.update(state, selected);
}

function renderPerms() {
  $("perms").innerHTML = state.permissions.map((p) => `<div class="perm" role="alert">
    <div class="grow"><b>${esc(p.agent ? p.agent + " wants" : "Jarvis wants")} to use ${esc(p.tool)}</b><br><code>${esc(p.detail)}</code></div>
    <button class="btn primary" data-allow="${p.id}">Allow</button><button class="btn danger" data-deny="${p.id}">Deny</button></div>`).join("");
}

function renderPanel() {
  const t = target(selected) || target("jarvis");
  const log = $("log");
  const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  $("p-title").innerHTML = `${esc(t.title)}` + (t.brain ? "" : ` <span class="state ${t.state === "working" ? "working" : ""}">${esc(stateLabel(t.id, t.state))}</span>`);
  $("p-sub").textContent = t.sub || "";
  log.innerHTML = t.messages?.length ? t.messages.map((m) => m.role === "tool"
      ? `<div class="msg tool">⚙ ${esc(m.name)} ${esc(m.detail)}</div>`
      : `<div class="msg ${m.role}">${md(m.text)}</div>`).join("") : `<div class="empty">No conversation yet.</div>`;
  if (stick) log.scrollTop = log.scrollHeight;
  renderActions(t);
  const isMain = ["jarvis", "brain", "board"].includes(t.id);             // nothing selected = Jarvis's chat
  $("text").placeholder = isMain ? "Message Jarvis…  (Enter to send, Shift+Enter for a new line)" : `Message for the ${t.title}… (goes through Jarvis)`;
  $("hint").textContent = !state.tmux ? "Typing needs the office session: run `jarvis office` in a terminal." :
    isMain ? "Typed into your terminal session, so both stay in sync." : "Sub-agents take a job and report back; Jarvis passes this on.";
}

// What the selected person needs from you: permission requests, Jarvis's open question, Brain buttons.
function permsFor(id) {
  return state.permissions.filter((p) => id === "jarvis" ? !p.agent : p.agent === id || p.agentId === id);
}
function renderActions(t) {
  const box = $("actions"), parts = [];
  for (const p of permsFor(t.id)) parts.push(`<div><b>${esc(t.title)} wants to use ${esc(p.tool)}</b><code>${esc(p.detail)}</code>
    <div class="row"><button class="btn primary" data-allow="${p.id}">Allow</button><button class="btn danger" data-deny="${p.id}">Deny</button></div></div>`);
  const q = state.question;
  if (t.id === "jarvis" && q) {
    q.questions.forEach((qq, qi) => parts.push(`<div class="q"><b>${esc(qq.question)}</b>
      <div class="row">${qq.options.map((o, i) => `<button class="opt" data-key="${i + 1}">${esc(o)}</button>`).join("")}</div>
      ${qq.multi ? `<span class="hint">Pick all that apply, then Submit.</span>` : q.questions.length > 1 ? `<span class="hint">Question ${qi + 1} of ${q.questions.length}: answer them in order.</span>` : ""}</div>`));
    parts.push(`<div class="q"><div class="row">${q.questions.length > 1 || q.questions.some((x) => x.multi) ? `<button class="btn primary" data-key="Enter">Submit</button>` : ""}
      <button class="btn" data-key="Escape">Skip for now</button><span class="hint">For "Other", type your answer in the terminal below.</span></div></div>`);
  }
  if (t.id === "brain") parts.push(`<div class="brainbox"><b>Your second brain</b><span class="hint">${state.ops?.vault ? `${state.ops.vault.pages} pages · ${state.ops.vault.people} people · ${state.ops.vault.clients} clients` : ""}</span>
    <div class="row"><button class="btn primary" id="open-obsidian">Open in Obsidian</button></div>
    <span class="hint">Obsidian's graph view (the circle-of-dots icon) shows how your pages connect.</span></div>`);
  const html = parts.join("");
  if (box.dataset.html !== html) { box.innerHTML = html; box.dataset.html = html; }
}

let wasAsking = false;
function renderTerm() {
  const sc = state.screen || { text: "", asking: false };
  const term = $("term");
  term.hidden = !state.tmux;
  term.classList.toggle("asking", sc.asking);
  $("termSum").textContent = sc.asking ? "Jarvis is asking you something: answer here or in the terminal" : "Terminal";
  if (sc.asking && !wasAsking) term.open = true;          // pop open when a picker or prompt appears
  wasAsking = sc.asking;
  const pre = $("screen");
  if (pre.textContent !== sc.text) { pre.textContent = sc.text; pre.scrollTop = pre.scrollHeight; }
}

function render() {
  $("live").classList.toggle("on", !!state.session);
  $("sub").textContent = state.session ? `${state.root.replace(/^\/Users\/[^/]+/, "~")}${state.tmux ? " · terminal linked" : " · view only"}` : "no Claude session in this folder yet";
  document.body.classList.toggle("ops-mode", view === "ops");
  document.querySelector(".stage").classList.toggle("ops", view === "ops");
  if (view === "office") renderOffice();
  else {
    if (!$("view").querySelector(".hud")) { mounted = false; OpsView.mount($("view"), { send: (text) => post("/api/send", { text }) }); }
    OpsView.update(state);
  }
  $("v-office").setAttribute("aria-pressed", view === "office");
  $("v-ops").setAttribute("aria-pressed", view === "ops");
  renderPerms();
  renderPanel();
  renderTerm();
}

document.addEventListener("click", async (e) => {
  const pick = e.target.closest("[data-select]");
  if (pick) { selected = pick.dataset.select; render(); return; }
  const sel = e.target.closest("[data-id]");
  if (sel) { selected = sel.dataset.id; render(); return; }
  const k = e.target.closest("[data-key]");
  if (k) { try { await post("/api/send", { key: k.dataset.key }); } catch (err) { toast(err.message); } return; }
  const a = e.target.closest("[data-allow],[data-deny]");
  if (a) {
    const id = a.dataset.allow || a.dataset.deny;
    try { await post(`/api/permission/${id}`, { behavior: a.dataset.allow ? "allow" : "deny" }); toast(a.dataset.allow ? "Allowed" : "Denied"); }
    catch (err) { toast(err.message); }
  }
});
$("v-office").onclick = () => { view = "office"; try { localStorage.setItem("office-view", view); } catch {} render(); };
$("v-ops").onclick = () => { view = "ops"; try { localStorage.setItem("office-view", view); } catch {} render(); };

async function sendText() {
  const text = $("text").value.trim();
  if (!text) return;
  const t = target(selected);
  const out = !t || t.id === "jarvis" || t.id === "brain" || t.id === "board" ? text : `Message for the ${t.title} sub-agent (send it a follow-up, or re-run it with this): ${text}`;
  try { await post("/api/send", { text: out }); $("text").value = ""; toast("Sent to your session"); }
  catch (err) { toast(err.message); }
}
$("sendBtn").onclick = sendText;
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(); } });
$("escBtn").onclick = async () => { try { await post("/api/send", { key: "Escape" }); toast("Interrupt sent"); } catch (err) { toast(err.message); } };

// ---------- Brain graph (Obsidian-style) ----------
const FOLDER_COLORS = { me: "#E8A838", work: "#4D8FE0", life: "#5FAF7E", relationships: "#E26D8A", journal: "#8A5BC7", frameworks: "#40BFB4", inbox: "#9AA5B1", "(root)": "#D8DEE6" };
const G = { nodes: [], links: [], byId: {}, vault: "", view: { x: 0, y: 0, k: 1 }, hover: null, drag: null, running: false };
async function openObsidian(rel) {
  try { const r = await post("/api/open-obsidian", { path: rel }); toast(r.message || "Opening Obsidian"); }
  catch (err) { toast(err.message.includes("not found") ? "The dashboard needs a restart: run `jarvis office` in a terminal." : err.message); }
}
function obsidianUrl(rel) { return "obsidian://open?path=" + encodeURIComponent(G.vault + (rel ? "/" + rel : "")); }
async function openGraph() {
  const r = await fetch(`/api/graph?t=${TOKEN}`), data = await r.json().catch(() => ({}));
  if (!r.ok || !Array.isArray(data.nodes)) throw new Error("The dashboard needs a restart for the graph: run `jarvis office` in a terminal.");
  G.vault = data.vault || state.root + "/knowledge";
  const deg = {};
  data.links.forEach((l) => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
  G.nodes = data.nodes.map((n, i) => ({ ...n, deg: deg[n.id] || 0, x: Math.cos(i * 2.4) * (40 + i * 3), y: Math.sin(i * 2.4) * (40 + i * 3), vx: 0, vy: 0 }));
  G.byId = Object.fromEntries(G.nodes.map((n) => [n.id, n]));
  G.links = data.links.map((l) => ({ a: G.byId[l.source], b: G.byId[l.target] })).filter((l) => l.a && l.b);
  const folders = [...new Set(G.nodes.map((n) => n.folder))];
  $("g-legend").innerHTML = folders.map((f) => `<span><i style="background:${FOLDER_COLORS[f] || "#B7C4D1"}"></i>${esc(f)}</span>`).join("");
  $("g-sub").textContent = `${G.nodes.length} pages · ${G.links.length} links`;
  $("graph").classList.add("open"); $("g-note").classList.remove("show");
  G.view = { x: 0, y: 0, k: 1 }; G.alpha = 1;
  if (!G.running) { G.running = true; requestAnimationFrame(tickGraph); }
}
function tickGraph() {
  if (!$("graph").classList.contains("open")) { G.running = false; return; }
  const N = G.nodes, a = G.alpha;
  if (a > 0.01) {
    for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
      const p = N[i], q = N[j]; let dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy + 0.01;
      if (d2 > 90000) continue;
      const f = (900 / d2) * a; dx *= f; dy *= f; p.vx -= dx; p.vy -= dy; q.vx += dx; q.vy += dy;
    }
    for (const l of G.links) { const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y, d = Math.hypot(dx, dy) || 1, f = ((d - 70) / d) * 0.04 * a; l.a.vx += dx * f; l.a.vy += dy * f; l.b.vx -= dx * f; l.b.vy -= dy * f; }
    for (const n of N) { if (n === G.drag) continue; n.vx -= n.x * 0.004 * a; n.vy -= n.y * 0.004 * a; n.x += n.vx; n.y += n.vy; n.vx *= 0.82; n.vy *= 0.82; }
    G.alpha *= 0.992;
  }
  drawGraph(); requestAnimationFrame(tickGraph);
}
function drawGraph() {
  const cv = $("g-canvas"), dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const c = cv.getContext("2d"), V = G.view;
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
  c.translate(w / 2 + V.x, h / 2 + V.y); c.scale(V.k, V.k);
  const hot = G.hover, near = new Set(hot ? G.links.filter((l) => l.a === hot || l.b === hot).flatMap((l) => [l.a, l.b]) : []);
  c.lineWidth = 1 / V.k;
  for (const l of G.links) { c.strokeStyle = hot && (l.a === hot || l.b === hot) ? "rgba(232,168,56,.85)" : "rgba(160,180,200,.22)"; c.beginPath(); c.moveTo(l.a.x, l.a.y); c.lineTo(l.b.x, l.b.y); c.stroke(); }
  for (const n of G.nodes) {
    const r = 3 + Math.sqrt(n.deg) * 2.2, dim = hot && !near.has(n) && n !== hot;
    c.globalAlpha = dim ? 0.25 : 1; c.fillStyle = FOLDER_COLORS[n.folder] || "#B7C4D1";
    c.beginPath(); c.arc(n.x, n.y, r, 0, Math.PI * 2); c.fill();
    if (n === hot || near.has(n) || n.deg >= 4 || V.k > 1.8) { c.fillStyle = "#DCE6EE"; c.font = `${12 / V.k}px -apple-system, sans-serif`; c.fillText(n.title, n.x + r + 3 / V.k, n.y + 4 / V.k); }
  }
  c.globalAlpha = 1;
}
function graphPoint(e) { const cv = $("g-canvas"), r = cv.getBoundingClientRect(), V = G.view; return { x: (e.clientX - r.left - cv.clientWidth / 2 - V.x) / V.k, y: (e.clientY - r.top - cv.clientHeight / 2 - V.y) / V.k }; }
function nodeAt(pt) { let best = null, bd = 144 / (G.view.k * G.view.k); for (const n of G.nodes) { const d = (n.x - pt.x) ** 2 + (n.y - pt.y) ** 2; if (d < bd) { bd = d; best = n; } } return best; }
(() => {
  const cv = $("g-canvas"); let pan = null, moved = false;
  cv.addEventListener("mousedown", (e) => { const n = nodeAt(graphPoint(e)); moved = false; if (n) { G.drag = n; } else pan = { x: e.clientX - G.view.x, y: e.clientY - G.view.y }; });
  window.addEventListener("mousemove", (e) => {
    if (!$("graph").classList.contains("open")) return;
    if (G.drag) { const pt = graphPoint(e); G.drag.x = pt.x; G.drag.y = pt.y; G.alpha = Math.max(G.alpha, 0.3); moved = true; }
    else if (pan) { G.view.x = e.clientX - pan.x; G.view.y = e.clientY - pan.y; moved = true; }
    else G.hover = nodeAt(graphPoint(e));
  });
  window.addEventListener("mouseup", async (e) => {
    const n = G.drag; G.drag = null; pan = null;
    if (n && !moved) {
      const note = $("g-note"); note.classList.add("show"); note.textContent = "Loading…";
      try { const r = await (await fetch(`/api/note?t=${TOKEN}&path=${encodeURIComponent(n.id)}`)).json();
        note.innerHTML = `<b>${esc(n.title)}</b>\n<span class="sub">${esc(n.id)}</span>\n<a href="#" data-obsidian="${esc(n.id)}">Open this page in Obsidian</a>\n\n${esc(r.text || r.error || "")}`; }
      catch (err) { note.textContent = err.message; }
    }
  });
  cv.addEventListener("wheel", (e) => { e.preventDefault(); const k = Math.min(4, Math.max(0.2, G.view.k * (e.deltaY < 0 ? 1.1 : 0.9))); G.view.x *= k / G.view.k; G.view.y *= k / G.view.k; G.view.k = k; }, { passive: false });
  $("g-close").onclick = () => $("graph").classList.remove("open");
  $("g-obsidian").onclick = () => openObsidian("");
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("graph").classList.remove("open"); });
  document.addEventListener("click", (e) => {
    if (e.target.id === "open-graph") openGraph().catch((err) => toast(err.message));
    if (e.target.id === "open-obsidian") openObsidian("");
    const pg = e.target.closest("[data-obsidian]"); if (pg) { e.preventDefault(); openObsidian(pg.dataset.obsidian); }
  });
})();

function connect() {
  const es = new EventSource(`/stream?t=${TOKEN}`);
  es.onmessage = (ev) => { state = JSON.parse(ev.data); render(); };
  es.onerror = () => { $("live").classList.remove("on"); $("sub").textContent = "reconnecting…"; };
}
connect();
</script>
